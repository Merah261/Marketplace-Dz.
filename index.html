<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Marketplace Dz</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <main class="landing-page">

    <div class="landing-container">

      <!-- BRAND -->

      <div class="brand-area">

        <div class="brand-mark">
          M
        </div>

        <div class="brand-name">
          Marketplace <span>Dz</span>
        </div>

        <p class="brand-description">
          Algeria's modern marketplace
        </p>

      </div>


      <!-- MAIN CONTENT -->

      <section class="hero">

        <div class="hero-label">
          BUY • SELL • DISCOVER
        </div>

        <h1>
          Everything you need,
          <br>
          in one marketplace.
        </h1>

        <p class="hero-text">
          Discover products from sellers across
          Algeria or start selling your own products.
        </p>


        <!-- BUTTONS -->

        <div class="action-area">

          <button
            class="primary-button"
            onclick="openCreateAccount()"
          >
            Create New Account
          </button>


          <button
            class="secondary-button"
            onclick="openLogin()"
          >
            Login
          </button>

        </div>

      </section>


      <!-- STATISTICS -->

      <section class="statistics">

        <div class="stat-card">

          <strong>
            0+
          </strong>

          <span>
            Users
          </span>

        </div>


        <div class="stat-card">

          <strong>
            0+
          </strong>

          <span>
            Downloads
          </span>

        </div>


        <div class="stat-card">

          <strong>
            0+
          </strong>

          <span>
            Products
          </span>

        </div>

      </section>


      <!-- FOOTER -->

      <footer>

        <span>
          Marketplace Dz
        </span>

        <span class="footer-dot">
          •
        </span>

        <span>
          Algeria
        </span>

      </footer>

    </div>

  </main>


  <script src="script.js"></script>

</body>

</html>
